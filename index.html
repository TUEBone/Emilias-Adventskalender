<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emilias Adventskalender</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:white;min-height:100vh;text-align:center;background:linear-gradient(#102b54,#345a89 65%,#d8ecff);transition:background 1s}body.w2{background:linear-gradient(#362451,#815e9b 65%,#f3d9ef)}body.w3{background:linear-gradient(#073d3e,#247d72 65%,#d7f5df)}body.w4{background:linear-gradient(#3d1730,#a34758 65%,#ffe0d0)}header{padding:30px 15px 12px}h1{font-size:clamp(28px,7vw,52px);margin:0;text-shadow:0 3px 12px #123}p{margin:10px auto;max-width:550px}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px}button{font:inherit;cursor:pointer}select,.toggle{background:#fff;color:#25314b;border:0;border-radius:20px;padding:10px 16px}.grid{max-width:820px;margin:22px auto 50px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.door{position:relative;min-height:100px;border:2px solid #ffffffb0;border-radius:16px;color:white;font-size:clamp(24px,5vw,42px);font-weight:800;text-shadow:0 2px 5px #345;background:linear-gradient(140deg,#db3b59,#8d1d44);box-shadow:0 7px 0 #ffffff40,0 12px 18px #1228;transition:transform .2s}.door:nth-child(3n){background:linear-gradient(140deg,#138d8c,#145267)}.door:nth-child(4n){background:linear-gradient(140deg,#e8a640,#af5c27)}.door:hover{transform:translateY(-4px) rotate(-1deg)}.door.opened{outline:3px solid #ffdd7b}.snow{font-size:32px;letter-spacing:22px;opacity:.8}.overlay{position:fixed;inset:0;background:#081529c9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}.modal{width:min(95vw,460px);background:linear-gradient(150deg,#fff9ed,#e9f6ff);color:#23304d;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}.modal h2{font-size:30px}.close{border:0;border-radius:20px;padding:12px 26px;background:#a82d57;color:white}.emoji{font-size:70px}footer{padding:20px;color:#203e61;font-size:13px}@media(max-width:430px){.grid{gap:8px}.door{min-height:75px;border-radius:12px}}</style></head><body><header><div class="snow">❄ ✦ ❄</div><h1>✨ Emilias Adventskalender ✨</h1><p>24 kleine Weihnachtsüberraschungen – nur für dich!</p></header><div class="toolbar"><label class="toggle">Winterwelt <select id="world"><option value="auto">Automatisch</option><option value="1">Schneewald</option><option value="2">Zauberhimmel</option><option value="3">Nordlicht</option><option value="4">Weihnachtsabend</option></select></label><label class="toggle"><input id="test" type="checkbox"> Testmodus</label></div><p id="hint">Im Dezember öffnet sich jeden Tag ein neues Türchen.</p><main class="grid" id="grid"></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="emoji" id="emoji"></div><h2 id="heading"></h2><p id="message"></p><button class="close" id="close">Schließen ✨</button></div></div><footer>Mit Liebe für Emilia ❤️</footer><script>
const gifts=[["🎄","Dein Weihnachtsabenteuer beginnt! Heute gehört dir ein extra großes Lächeln."],["⭐","Wunschstern: Denk dir einen geheimen Wunsch aus."],["☕","Zeit für eine gemütliche Tasse Kakao."],["🎶","Heute ist dein Tag für ein Lieblingslied und eine kleine Tanzparty."],["🦌","Ein Rentier hat eine Nachricht: Du bist wunderbar!"],["🎅","Nikolauszauber! Halte heute nach einer kleinen Überraschung Ausschau."],["🍪","Backidee: Verziere einen Keks so verrückt wie möglich."],["❄️","Mini-Mission: Entdecke draußen drei schöne Winterdinge."],["💌","Schreibe jemandem eine liebe Nachricht."],["🎬","Heute wäre ein perfekter Abend für einen Weihnachtsfilm."],["🌟","Deine Superkraft heute: Bring jemanden zum Lachen."],["🧣","Mach es dir richtig gemütlich – mit Decke und Lieblingsmusik."],["🎨","Male einen Weihnachtsbaum, den es noch nie gab."],["🧩","Rätsel: Was fällt im Winter, tut aber nicht weh? Schnee!"],["💃","Eine Minute verrückt tanzen – Herausforderung angenommen?"],["🕯️","Wünsch dir einen besonders schönen Moment für diese Woche."],["🎁","Überraschungsmission: Mach jemandem ein kleines Kompliment."],["⛄","Erfinde einen lustigen Namen für einen Schneemann."],["🦄","Stell dir vor, ein magisches Einhorn bringt dich zum Nordpol!"],["⚽","Weihnachts-Challenge: Erfinde einen neuen Fußball-Jubel."],["🍫","Heute darfst du dir eine kleine süße Pause gönnen."],["🎵","Sing den Refrain deines Lieblingssongs."],["💖","Denk an drei Dinge, auf die du dich freust."],["🎉","Frohe Weihnachten, Emilia! Du bist das größte Geschenk. ❤️"]];
const grid=document.getElementById('grid'),test=document.getElementById('test'),world=document.getElementById('world'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay');const now=new Date();let opened={};try{opened=JSON.parse(localStorage.getItem('emilia-opened')||'{}')}catch(e){}function available(n){return test.checked||(now.getMonth()===11&&now.getDate()>=n)}function theme(){let w=world.value==='auto'?(now.getMonth()===11?Math.min(4,Math.floor((now.getDate()-1)/7)+1):1):+world.value;document.body.className='w'+w}function render(){theme();hint.textContent=test.checked?'Testmodus: Alle 24 Türchen sind zum Ausprobieren geöffnet.':'Im Dezember öffnet sich jeden Tag ein neues Türchen.';grid.innerHTML='';for(let i=1;i<=24;i++){let b=document.createElement('button');b.className='door'+(opened[i]?' opened':'');b.textContent=i;b.setAttribute('aria-label','Türchen '+i);b.onclick=()=>{if(!available(i)){show('🔒','Noch ein bisschen Geduld!','Türchen '+i+' öffnet sich am '+i+'. Dezember.');return}opened[i]=true;try{localStorage.setItem('emilia-opened',JSON.stringify(opened))}catch(e){}show(gifts[i-1][0],'Türchen '+i,gifts[i-1][1]);render()};grid.appendChild(b)}}function show(e,h,m){document.getElementById('emoji').textContent=e;document.getElementById('heading').textContent=h;document.getElementById('message').textContent=m;overlay.classList.add('show')}document.getElementById('close').onclick=()=>overlay.classList.remove('show');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};test.onchange=render;world.onchange=theme;render();
</script></body></html>
