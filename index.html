<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emilias Adventskalender</title>
<link rel="stylesheet" href="puzzles/puzzles.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#080f33;color:#fff9e9;font:1rem system-ui}
main{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center}
main::before{content:"";position:absolute;inset:-30px;background:center/cover url(calendar.svg);filter:blur(24px) brightness(.45)}
#scene{position:relative;width:min(100vw,46.15dvh);aspect-ratio:852/1846;background:center/100% 100% url(calendar.svg);transition:transform 2s cubic-bezier(.6,0,.28,1)}
.door{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:none;padding:0;cursor:pointer;perspective:150px}
.door:focus-visible,.door[data-opened]{outline:2px solid #ffe0a3;outline-offset:2px}
.door.opening{background:radial-gradient(circle,#fffbe0 5%,#ffca61 34%,#a143c5 65%,#120b40 90%);box-shadow:0 0 20px #ffe482;z-index:1}
.door.opening::after{content:"";position:absolute;inset:0;border-radius:50%;background-image:url(calendar.svg);background-size:var(--size);background-position:var(--position);transform-origin:left center;animation:open 1s ease-in-out forwards}
@keyframes open{to{transform:rotateY(-110deg);opacity:.55}}
.test{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;background:#091236dc;border:1px solid #ffffff55;border-radius:100px;padding:8px 12px;font-size:.83rem}
@media(prefers-reduced-motion:reduce){*,*::after{animation-duration:0s!important;transition-duration:0s!important}}

.weather{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.aurora{position:absolute;inset:-8% -18% 56%;background:radial-gradient(ellipse 26% 13% at 30% 59%,#48ffd5a0,transparent 85%),radial-gradient(ellipse 31% 12% at 60% 45%,#c24cff9c,transparent 85%),radial-gradient(ellipse 24% 11% at 81% 59%,#27ffe77e,transparent 85%);mix-blend-mode:screen;filter:blur(12px);transform:rotate(-28deg);animation:aurora-drift 13s ease-in-out infinite alternate}
@keyframes aurora-drift{from{opacity:.25;transform:translate(-5%,2%) rotate(-31deg)}to{opacity:.75;transform:translate(6%,-5%) rotate(-24deg)}}
.flake::before{content:"";position:absolute;inset:0;background:#eefbff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:crystal-twinkle var(--sparkle) ease-in-out infinite alternate}
@keyframes crystal-twinkle{from{opacity:.32;transform:scale(.68) rotate(0deg)}to{opacity:1;transform:scale(1.45) rotate(40deg)}}
.flake{position:absolute;top:-8px;width:var(--diameter);height:var(--diameter);filter:drop-shadow(0 0 2px #b9ecff);opacity:var(--alpha);animation:snowfall var(--duration) var(--delay) linear infinite}
@keyframes snowfall{to{transform:translate(var(--drift),calc(100dvh + 16px))}}
.meteor{position:absolute;top:5%;left:83%;width:clamp(72px,24%,180px);height:4px;border-radius:50%;background:linear-gradient(90deg,#fff,transparent);filter:drop-shadow(0 0 4px #9ceaff);opacity:0;animation:shoot 7s linear infinite}
@keyframes shoot{0%,10%{opacity:0;transform:translate(0,0) rotate(-26deg)}13%{opacity:.95}28%,100%{opacity:0;transform:translate(-56vw,27vw) rotate(-26deg)}}
#scene:has(.opening) .weather{visibility:hidden}
@media(prefers-reduced-motion:reduce){.weather{display:none}}
@media(orientation:portrait) and (max-width:600px){#scene{width:100vw;height:max(216.67vw,100dvh);flex:none}main{grid-template:100% / 100%;align-items:center}}</style>
<main aria-label="Emilias Adventskalender"><div id="scene"><div class="weather" aria-hidden="true"><div class="aurora"></div><div class="meteor"></div></div></div></main>
<label class="test"><input type="checkbox" id="test"> Testmodus</label>
<dialog id="chapter" aria-labelledby="heading">
  <div class="chapter-inner">
    <header class="chapter-header">
      <button id="back" type="button">← Zum Kalender</button>
      <span id="day"></span>
    </header>
    <h1 id="heading"></h1>
    <section id="day-content">
      <button id="open-puzzle" type="button" class="puzzle-card" hidden>
        <span>
          <span id="puzzle-kind"></span>
          <strong id="puzzle-name"></strong>
          <span class="puzzle-action">Rätsel öffnen</span>
        </span>
        <span class="puzzle-arrow" aria-hidden="true">→</span>
      </button>
      <p id="story" hidden></p>
      <p id="calendar-message" role="status" hidden></p>
    </section>
    <section id="puzzle-content" hidden></section>
  </div>
</dialog>
<script type="module">
import { mountPuzzle, puzzleKinds, puzzles } from './puzzles/puzzles.js';

const positions = [[644,373,52],[536,488,58],[702,478,52],[634,530,40],[453,573,49],[576,612,52],[751,585,64],[419,685,49],[537,673,37],[690,685,58],[803,719,43],[452,765,70],[582,739,54],[652,775,35],[373,847,50],[545,842,52],[729,831,80],[825,853,45],[420,923,51],[608,914,36],[344,984,50],[504,982,59],[693,963,67],[433,1056,61]];
const scene = document.querySelector('#scene');
const test = document.querySelector('#test');
test.checked = new URLSearchParams(location.search).has('test');
const chapter = document.querySelector('#chapter');
const heading = document.querySelector('#heading');
const back = document.querySelector('#back');
const dayContent = document.querySelector('#day-content');
const puzzleContent = document.querySelector('#puzzle-content');
const openPuzzle = document.querySelector('#open-puzzle');
const story = document.querySelector('#story');
const message = document.querySelector('#calendar-message');
let opened = {};
let activeDoor;
let activePuzzle;
let puzzleRequest;
let testing = false;

try { opened = JSON.parse(localStorage.getItem('emilia-opened')) || {}; } catch {}

function show(number, unlocked) {
  activePuzzle = unlocked ? puzzles[number - 1] : null;
  document.querySelector('#day').textContent = number + '. Dezember';
  showDay();
  chapter.showModal();
  chapter.scrollTop = 0;
}

function showDay() {
  puzzleRequest?.abort();
  puzzleContent.replaceChildren();
  puzzleContent.hidden = true;
  dayContent.hidden = false;
  back.textContent = '← Zum Kalender';
  heading.textContent = activePuzzle ? 'Türchen ' + activePuzzle.day : 'Die Kugel schläft noch';
  message.hidden = Boolean(activePuzzle);
  message.textContent = activePuzzle ? '' : 'Diese Kugel öffnet sich am ' + document.querySelector('#day').textContent + ' 2026.';
  openPuzzle.hidden = !activePuzzle;
  story.textContent = activePuzzle?.story ?? '';
  story.hidden = !story.textContent;
  if (activePuzzle) {
    document.querySelector('#puzzle-kind').textContent = puzzleKinds[activePuzzle.kind];
    document.querySelector('#puzzle-name').textContent = activePuzzle.title;
  }
}

openPuzzle.addEventListener('click', async () => {
  const request = new AbortController();
  puzzleRequest = request;
  dayContent.hidden = true;
  puzzleContent.hidden = false;
  back.textContent = '← Zum Türchen';
  heading.textContent = activePuzzle.title;
  chapter.scrollTop = 0;
  back.focus({preventScroll:true});
  try {
    await mountPuzzle(puzzleContent,activePuzzle,testing,request.signal);
  } catch {
    if (!request.signal.aborted) puzzleContent.textContent = 'Das Rätsel konnte nicht geladen werden. Öffne es noch einmal.';
  }
});
function goBack() {
  if (!puzzleContent.hidden) {
    showDay();
    chapter.scrollTop = 0;
    openPuzzle.focus({preventScroll:true});
  } else {
    chapter.close();
  }
}
back.addEventListener('click',goBack);
chapter.addEventListener('cancel',event=>{
  event.preventDefault();
  goBack();
});

const pause = ms => new Promise(resolve => setTimeout(resolve, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
positions.forEach(([x,y,size], index) => {
  const number = index + 1;
  const button = document.createElement('button');
  button.className = 'door';
  button.setAttribute('aria-label', 'Türchen ' + number);
  button.style.cssText = `left:${x/852*100}%;top:${y/1846*100}%;width:${size/852*100}%;height:${size/1846*100}%;--size:${852/size*100}% ${1846/size*100}%;--position:${(x-size/2)/(852-size)*100}% ${(y-size/2)/(1846-size)*100}%`;
  if (opened[number]) button.dataset.opened = '';
  button.onclick = async () => {
    if (activeDoor || chapter.open) return;
    const today = new Date();
    testing = test.checked;
    if (!testing && today < new Date(2026,11,number)) {
      show(number, false);
      return;
    }
    activeDoor = button;
    test.disabled = true;
    button.classList.add('opening');
    await pause(1000);
    scene.style.transformOrigin = `${x/852*100}% ${y/1846*100}%`;
    const scale = 22;
    scene.style.transform = `translate(${(0.5-x/852)*scene.clientWidth}px,${(0.5-y/1846)*scene.clientHeight}px) scale(${scale})`;
    await pause(2010);
    if (!testing) {
      opened[number] = true;
      button.dataset.opened = '';
      try { localStorage.setItem('emilia-opened', JSON.stringify(opened)); } catch {}
    }
    show(number, true);
  };
  scene.append(button);
});
chapter.addEventListener('close', async () => {
  puzzleRequest?.abort();
  puzzleContent.replaceChildren();
  scene.style.transform = '';
  if (!activeDoor) return;
  await pause(2000);
  activeDoor.classList.remove('opening');
  activeDoor.focus({preventScroll:true});
  activeDoor = null;
  test.disabled = false;
});

const weather = document.querySelector('.weather');
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  for (let i = 0; i < 88; i++) {
    const flake = document.createElement('span');
    flake.className = 'flake';
    flake.style.cssText = `left:${Math.random()*100}%;--diameter:${2+Math.random()*4.5}px;--alpha:${.35+Math.random()*.6};--duration:${11+Math.random()*13}s;--delay:${-Math.random()*24}s;--drift:${(Math.random()-.5)*85}px`;
    flake.style.setProperty('--sparkle', (1.4 + Math.random() * 2.6) + 's');
    weather.append(flake);
  }
}
</script>
</html>
